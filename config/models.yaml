# Model registry (FR-1..FR-3). Every entry is called through LiteLLM (FR-4).
# Pick a model per task in the UI / CLI / task file - no code change needed.
# Any raw LiteLLM model string (e.g. "groq/llama-3.1-8b-instant") also works without an entry here.
models:
  # --- Local models via OpenAI-compatible endpoints (FR-2) ---
  # Small models (laptop, 8 GB RAM, no GPU needed). Pull with: ollama pull <tag>
  - id: ollama-qwen3-4b
    label: "Ollama: qwen3:4b-instruct (2.5 GB, best small)"
    model: ollama_chat/qwen3:4b-instruct
    api_base: ${OLLAMA_API_BASE:-http://localhost:11434}
    kind: local
  - id: ollama-qwen2.5-3b
    label: "Ollama: qwen2.5:3b (1.9 GB)"
    model: ollama_chat/qwen2.5:3b
    api_base: ${OLLAMA_API_BASE:-http://localhost:11434}
    kind: local
  - id: ollama-llama3.2-3b
    label: "Ollama: llama3.2:3b (2.0 GB)"
    model: ollama_chat/llama3.2:3b
    api_base: ${OLLAMA_API_BASE:-http://localhost:11434}
    kind: local
  - id: ollama-qwen3-1.7b
    label: "Ollama: qwen3:1.7b (1.4 GB)"
    model: ollama_chat/qwen3:1.7b
    api_base: ${OLLAMA_API_BASE:-http://localhost:11434}
    kind: local
  - id: ollama-qwen2.5-1.5b
    label: "Ollama: qwen2.5:1.5b (1.0 GB, smoke tests)"
    model: ollama_chat/qwen2.5:1.5b
    api_base: ${OLLAMA_API_BASE:-http://localhost:11434}
    kind: local
  # Larger models (GPU recommended)
  - id: ollama-llama3.1
    label: "Ollama: llama3.1:8b"
    model: ollama_chat/llama3.1:8b
    api_base: ${OLLAMA_API_BASE:-http://localhost:11434}
    kind: local
  - id: ollama-qwen2.5
    label: "Ollama: qwen2.5:7b (good at tool calls)"
    model: ollama_chat/qwen2.5:7b
    api_base: ${OLLAMA_API_BASE:-http://localhost:11434}
    kind: local
  - id: vllm
    label: "vLLM (OpenAI-compatible server)"
    model: openai/${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
    api_base: ${VLLM_API_BASE:-http://localhost:8001/v1}
    api_key: ${VLLM_API_KEY:-none}
    kind: local
  - id: llamacpp
    label: "llama.cpp server (OpenAI-compatible)"
    model: openai/local-model
    api_base: ${LLAMACPP_API_BASE:-http://localhost:8080/v1}
    api_key: none
    kind: local

  # --- Cloud models via API keys (FR-1; optional, budget-capped) ---
  - id: gemini-flash
    label: "Gemini 2.5 Flash"
    model: gemini/gemini-2.5-flash
    requires_env: GEMINI_API_KEY
    kind: cloud
  - id: gpt-4o-mini
    label: "OpenAI GPT-4o mini"
    model: openai/gpt-4o-mini
    requires_env: OPENAI_API_KEY
    kind: cloud
  - id: claude-haiku
    label: "Anthropic Claude Haiku 4.5"
    model: anthropic/claude-haiku-4-5-20251001
    requires_env: ANTHROPIC_API_KEY
    kind: cloud
