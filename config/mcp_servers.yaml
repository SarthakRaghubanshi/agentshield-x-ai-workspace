# MCP servers (FR-8). Their tools are registered in the tool gateway automatically - add a server
# here, no code changes needed. Tool names are exposed to the agent as  mcp__<server>__<tool>.
#
# Two kinds of server:
#   local  (stdio):  command + args   - launched as a subprocess inside the sandbox
#   remote (HTTP):   url              - an MCP server speaking Streamable HTTP, e.g.
#       notes:
#         url: http://notes-mcp:9000/mcp
#         risk_level: low
#         resources: ["notes"]
#   (under Docker the sandbox has no internet, so remote servers must be on the internal network)
servers:
  calendar:
    command: python
    args: ["mcp_servers/calendar_server.py"]
    env: {}                     # SANDBOX_ROOT is passed automatically
    risk_level: medium          # FR-10 metadata applied to every tool from this server
    resources: ["calendar"]
    output_source: tool_output
    enabled: true
