name: ci
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  postgres:
    # PRD FR-21: the same suite with telemetry stored in PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentshield
          POSTGRES_PASSWORD: agentshield
          POSTGRES_DB: telemetry
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentshield -d telemetry" --health-interval 5s --health-retries 20
    env:
      TELEMETRY_DB_URL: postgresql://agentshield:agentshield@localhost:5432/telemetry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  docker:
    # PRD NFR-7 (one command) and FR-11 (isolated sandbox): build, start, probe.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up
        run: docker compose up --build -d
      - name: workspace is healthy and reaches every tool through the sandbox container
        run: |
          for i in $(seq 1 90); do curl -sf localhost:8000/api/health && break; sleep 2; done
          curl -sf localhost:8000/api/health | tee /dev/stderr | grep -q '"sandbox_mode":"remote"'
          curl -sf localhost:8000/api/tools | python3 -c "import sys,json; t=[x['name'] for x in json.load(sys.stdin)]; print(len(t), t); assert len(t) == 16"
          curl -sf localhost:8000/api/tasks | python3 -c "import sys,json; t=json.load(sys.stdin); print(len(t), 'tasks'); assert len(t) == 23"
          curl -sf -X POST localhost:8000/api/sandbox/reset
      - name: sandbox container has no internet access
        run: |
          if docker compose exec -T sandbox python -c "import urllib.request; urllib.request.urlopen('https://example.com', timeout=5)"; then
            echo "sandbox reached the internet"; exit 1
          fi
          echo "OK: sandbox is offline"
      - name: sandbox runs read-only, non-root, without capabilities
        run: |
          docker compose exec -T sandbox sh -c 'id -u' | grep -qx 1000
          if docker compose exec -T sandbox sh -c 'touch /app/x' 2>/dev/null; then echo "image is writable"; exit 1; fi
          docker inspect $(docker compose ps -q sandbox) --format '{{.HostConfig.CapDrop}} {{.HostConfig.ReadonlyRootfs}}' | tee /dev/stderr | grep -q 'ALL.*true'
      - if: always()
        run: docker compose logs --no-color | tail -200
